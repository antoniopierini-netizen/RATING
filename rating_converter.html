            const [selectedCountry, setSelectedCountry] = useState('Italia');
            const [inputValue, setInputValue] = useState('');
            const [result, setResult] = useState(null);

            const countries = {
                'Francia': { label: 'Francia (Conv. UFF)', unit: 'kg', step: 0.5 },
                'Gran_Bretagna': { label: 'Gran Bretagna (BHA)', unit: 'lb', step: 1 },
                'Italia': { label: 'Italia (UFF)', unit: 'rating', step: 0.5 }
            };

            const findRating = (country, value) => {
                const numValue = parseFloat(value);
                if (isNaN(numValue)) return null;

                // Cerca corrispondenza esatta
                let match = ratingsData.find(r => r[country] === numValue);
                
                // Se non trova corrispondenza esatta, cerca il più vicino
                if (!match) {
                    match = ratingsData.reduce((prev, curr) => {
                        return Math.abs(curr[country] - numValue) < Math.abs(prev[country] - numValue) ? curr : prev;
                    });
                }
                
                return match;
            };

            const handleSearch = () => {
                if (!inputValue) {
                    setResult(null);
                    return;
                }
                
                const match = findRating(selectedCountry, inputValue);
                setResult(match);
            };

                if (e.key === 'Enter') {
                    handleSearch();
                }

                                            setInputValue('');
                                            setResult(null);
                                        }}

                                                : 'bg-slate-100 text-slate-700 hover:bg-slate-200'

                                <div className="flex-1 relative">

                                        step={countries[selectedCountry].step}
                                        value={inputValue}
                                        onChange={(e) => setInputValue(e.target.value)}
                                        onKeyPress={handleKeyPress}
                                        placeholder={`Es: ${selectedCountry === 'Italia' ? '91' : selectedCountry === 'Francia' ? '26' : '62'}`}
                                        className="w-full px-4 py-3 text-lg border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:outline-none transition-colors"
                                    />
                                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 font-medium">
                                        {countries[selectedCountry].unit}
                                    </span>
                                </div>
                                <button
                                    onClick={handleSearch}
                                    className="px-8 py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors shadow-md hover:shadow-lg"
                                >
                                    Cerca
                                </button>
                            </div>
                        </div>

                        {/* Results Card */}
                        {result && (
                            <div className="bg-white rounded-2xl shadow-lg p-8 space-y-6 animate-fadeIn">

                                <div>

                                        <span className="text-2xl">🔄</span>

                                        <div className="bg-gradient-to-br from-green-50 to-green-100 rounded-xl p-5 border-2 border-green-200">

                                            <div className="text-3xl font-bold text-green-900">{result.Italia}</div>

                                                        : 'bg-slate-100 border-2 border-slate-300 text-slate-500'
                                                }`}
                                            >
                                                <div className="text-2xl mb-1">
                                                    {result[key] ? '✅' : '❌'}
                                                </div>
                                                <div className="text-sm">{label}</div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-4 p-4 bg-slate-50 rounded-lg text-sm text-slate-600">
                                        <strong>Nota:</strong> {
                                            [result.Classe_5, result.Classe_4, result.Classe_3, result.Classe_2].filter(Boolean).length === 0
